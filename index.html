    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preload" href="/images/hero-classroom.jpg" as="image" />
    <script>
      (function() {
        var hash = location.hash;
        if (hash && hash.indexOf('access_token=') !== -1) {
          if (location.pathname.indexOf('/auth/callback') === -1) {
            location.replace('/auth/callback' + location.hash);
          } else {
            sessionStorage.setItem('sb-hash', hash);
          }
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/website/main.tsx"></script>
  </body>
